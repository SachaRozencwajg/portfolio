<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable | Sacha Rozencwajg</title>
    <meta name="description" content="Erreur 404 : cette page n'existe pas.">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/webp" href="/photo-sacha.webp">
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('theme'); } catch (e) { }
            if (t !== 'light' && t !== 'dark') {
                t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="stylesheet" href="/style.css?v=20261027c">
    <style>
        .error-page {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: var(--space-6);
        }

        .error-code {
            font-family: var(--font-mono);
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
            letter-spacing: 0.12em;
            color: var(--color-accent);
            margin-bottom: var(--space-4);
        }

        .error-message {
            font-size: var(--text-4xl);
            line-height: 2.5rem;
            font-weight: var(--font-bold);
            letter-spacing: -0.02em;
            margin-bottom: var(--space-4);
        }

        .error-description {
            color: var(--text-secondary);
            max-width: 480px;
            margin-bottom: var(--space-8);
        }
    </style>
</head>

<body>
    <main class="container error-page">
        <p class="error-code">// ERREUR 404</p>
        <h1 class="error-message">Cette page n'existe pas</h1>
        <p class="error-description">
            Le lien est peut-être ancien, ou la page a été déplacée.
            Tout le contenu du site est accessible depuis l'accueil.
        </p>
        <a href="/" class="btn btn--primary">
            <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"/></svg>
            Retour à l'accueil
        </a>
    </main>
</body>

</html>
